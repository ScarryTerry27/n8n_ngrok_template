services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Brussels
      - N8N_SECURE_COOKIE=false
      - N8N_EDITOR_BASE_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
      - ./start-n8n.sh:/start-n8n.sh:ro
    entrypoint: ["sh", "/start-n8n.sh"]
    restart: unless-stopped
    depends_on:
      - ngrok

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: ["http", "http://n8n:5678", "--log=stdout"]
    ports:
      - "4040:4040"   # чтобы ты мог открыть http://localhost:4040 и видеть туннели
    restart: unless-stopped

volumes:
  n8n_data: